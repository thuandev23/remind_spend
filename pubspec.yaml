name: remind_spend
description: "Track spending automatically from bank notifications."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local DB — Flutter side (Sprint 4 sẽ dùng đầy đủ)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Secure storage — Flutter side
  flutter_secure_storage: ^9.0.0

  # Non-sensitive prefs (cleared on app uninstall, unlike Keychain)
  shared_preferences: ^2.3.0

  # Remote config fetch
  http: ^1.2.2

  # Gemini API package for generative AI auto-categorization
  google_generative_ai: ^0.4.0

  # Background periodic pull (Android WorkManager + iOS BGTaskScheduler)
  workmanager: ^0.9.0

  # Interactive and beautiful charting library
  fl_chart: ^0.71.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
